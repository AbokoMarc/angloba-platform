<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Inscription</title>
<link rel="stylesheet" href="/assets/css/base.css" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#FBF5EE" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="English Academy" />
<script src="/config.js"></script>
</head>
<body class="theme-student">
  <div class="auth-screen">
    <div class="auth-box">
      <div class="auth-logo">
        <span class="logo-glyph" id="logo-glyph"></span>
        <span class="name" id="platform-name"></span>
      </div>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-sub">Start your 9-month English journey today.</p>

      <div class="auth-error" id="error-box"></div>

      <form id="signup-form">
        <div class="field">
          <label for="name" class="visually-hidden">Full name</label>
          <div class="input-icon"><span data-ico="user"></span><input type="text" id="name" required placeholder="Full name" autocomplete="name" /></div>
        </div>
        <div class="field">
          <label for="email" class="visually-hidden">Email address</label>
          <div class="input-icon"><span data-ico="mail"></span><input type="email" id="email" required placeholder="Email address" autocomplete="email" inputmode="email" /></div>
        </div>
        <div class="field">
          <label for="password" class="visually-hidden">Password</label>
          <div class="input-icon"><span data-ico="lock"></span><input type="password" id="password" required minlength="6" placeholder="Password (6+ characters)" autocomplete="new-password" /><button type="button" class="eye-btn" aria-label="Afficher le mot de passe" id="eye"></button></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      </form>

      <p class="auth-footer">Déjà un compte ? <a href="/connexion.html">Se connecter</a></p>
      <p class="auth-footer"><a href="/index.html">← Retour à l'accueil</a></p>
    </div>
  </div>

  <script src="/assets/js/icons.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    (async () => {
      try {
        const { appearance } = await api.get("/appearance");
        document.documentElement.style.setProperty("--primary", appearance.theme_primary);
        document.documentElement.style.setProperty("--accent", appearance.theme_accent);
        document.getElementById("logo-glyph").textContent = appearance.logo_glyph;
        document.getElementById("platform-name").textContent = appearance.platform_name;
      } catch {}
    })();

    document.querySelectorAll("[data-ico]").forEach((el) => el.replaceWith(Object.assign(document.createElement("span"), { innerHTML: icon(el.dataset.ico) }).firstChild));
    const eye = document.getElementById("eye");
    eye.innerHTML = icon("eye");
    eye.addEventListener("click", () => {
      const input = document.getElementById("password");
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      eye.innerHTML = icon(show ? "eyeOff" : "eye");
    });

    const form = document.getElementById("signup-form");
    const errorBox = document.getElementById("error-box");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating...";
      try {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const { token, user } = await api.post("/auth/register", { name, email, password });
        Auth.setSession(token, user);
        window.location.href = "/student/dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "Une erreur est survenue.";
        errorBox.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });
  </script>
  <script src="/assets/js/pwa-register.js"></script>
</body>
</html>
