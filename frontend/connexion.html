<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Connexion</title>
<link rel="stylesheet" href="/assets/css/base.css" />
<script src="/config.js"></script>
</head>
<body>
  <div class="auth-screen">
    <div class="auth-box">
      <div class="auth-logo">
        <span class="logo-glyph" id="logo-glyph"></span>
        <span class="name" id="platform-name"></span>
      </div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to continue your English journey.</p>

      <div class="auth-error" id="error-box"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
      </form>

      <p class="auth-footer">Pas encore de compte ? <a href="/inscription.html">S'inscrire</a></p>
      <p class="auth-footer"><a href="/index.html">← Retour à l'accueil</a></p>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    (async () => {
      try {
        const { appearance } = await api.get("/appearance");
        document.documentElement.style.setProperty("--primary", appearance.theme_primary);
        document.documentElement.style.setProperty("--accent", appearance.theme_accent);
        document.getElementById("logo-glyph").textContent = appearance.logo_glyph;
        document.getElementById("platform-name").textContent = appearance.platform_name;
      } catch {}

      if (Auth.isLoggedIn() && Auth.getUser()?.role === "student") {
        window.location.href = "/student/dashboard.html";
      }
    })();

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error-box");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";
      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const { token, user } = await api.post("/auth/login", { email, password });

        if (user.role !== "student") {
          // Un compte prof/admin qui se trompe de porte : on le renvoie vers
          // la bonne page plutot que de le laisser entrer ici.
          errorBox.textContent = "Ce compte n'est pas un compte élève. Utilisez la page de connexion du personnel.";
          errorBox.classList.add("show");
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign in";
          return;
        }

        Auth.setSession(token, user);
        window.location.href = "/student/dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "Une erreur est survenue.";
        errorBox.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
