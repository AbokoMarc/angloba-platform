<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Courses</title>
<link rel="stylesheet" href="/assets/css/base.css" />
<link rel="manifest" href="/manifest-staff.json" />
<meta name="theme-color" content="#0F2544" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-staff.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="English Academy Staff" />
<script src="/config.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="shell-sidebar"></aside>
    <div class="main-col">
      <div class="topbar" id="shell-topbar"></div>
      <main class="content" id="page-content">
        <div style="display:grid;grid-template-columns:260px 1fr;gap:14px;" id="courses-layout">
          <div class="card" style="padding:10px;max-height:75vh;overflow-y:auto;" id="week-picker"><div class="empty-state"><span class="spinner"></span></div></div>
          <div class="stack" id="week-editor"></div>
        </div>
      </main>
    </div>
  </div>
  <nav class="bottom-nav" id="shell-bottomnav"></nav>

  <script src="/assets/js/icons.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/shell.js"></script>
  <script src="/admin/courses.js"></script>
  <script src="/assets/js/pwa-register.js"></script>
</body>
</html>
